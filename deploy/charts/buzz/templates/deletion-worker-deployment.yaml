{{- if .Values.deletionWorker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "buzz.fullname" . }}-deletion-worker
  labels:
    {{- include "buzz.labels" . | nindent 4 }}
    app.kubernetes.io/component: deletion-worker
spec:
  replicas: {{ .Values.deletionWorker.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "buzz.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: deletion-worker
  template:
    metadata:
      labels:
        {{- include "buzz.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: deletion-worker
      {{- with .Values.deletionWorker.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      # No Service/Ingress is created: only private pod health probes listen.
      serviceAccountName: {{ required "deletionWorker.serviceAccountName is required when deletionWorker.enabled=true; use a dedicated identity" .Values.deletionWorker.serviceAccountName }}
      automountServiceAccountToken: {{ .Values.deletionWorker.automountServiceAccountToken }}
      terminationGracePeriodSeconds: {{ .Values.deletionWorker.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.relay.securityContext | nindent 8 }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: deletion-worker
          image: {{ include "buzz.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.relay.containerSecurityContext | nindent 12 }}
          command: ["/usr/local/bin/buzz-admin"]
          args: ["deletions", "worker"]
          ports:
            - { name: health, containerPort: {{ .Values.deletionWorker.healthPort }}, protocol: TCP }
          env:
            - { name: RELAY_URL, value: {{ .Values.relayUrl | quote }} }
            - { name: BUZZ_DELETION_HEALTH_ADDR, value: {{ printf "0.0.0.0:%v" .Values.deletionWorker.healthPort | quote }} }
            - { name: BUZZ_DELETION_STORAGE_MAX_OBJECTS, value: {{ .Values.deletionWorker.storageMaxObjects | quote }} }
            - { name: BUZZ_DELETION_STORAGE_DELETE_BATCH_SIZE, value: {{ .Values.deletionWorker.storageDeleteBatchSize | quote }} }
            {{- $s3Endpoint := include "buzz.s3Endpoint" . }}
            {{- if $s3Endpoint }}
            - { name: BUZZ_S3_ENDPOINT, value: {{ $s3Endpoint | quote }} }
            {{- end }}
            - { name: BUZZ_S3_BUCKET, value: {{ .Values.s3.bucket | quote }} }
            {{- if .Values.s3.region }}
            - { name: BUZZ_S3_REGION, value: {{ .Values.s3.region | quote }} }
            {{- end }}
            - { name: BUZZ_S3_ADDRESSING_STYLE, value: {{ .Values.s3.addressingStyle | quote }} }
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ required "deletionWorker.existingSecret is required when deletionWorker.enabled=true" .Values.deletionWorker.existingSecret }}
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.deletionWorker.existingSecret }}
                  key: REDIS_URL
            - name: BUZZ_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.deletionWorker.existingSecret }}
                  key: BUZZ_S3_ACCESS_KEY
            - name: BUZZ_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.deletionWorker.existingSecret }}
                  key: BUZZ_S3_SECRET_KEY
            {{- with .Values.deletionWorker.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            httpGet: { path: /_liveness, port: health }
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet: { path: /_readiness, port: health }
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.deletionWorker.resources | nindent 12 }}
{{- end }}
