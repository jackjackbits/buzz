id: community-sql-execution
message: SQL execution constructor/builder used to prove repository-complete source coverage
severity: hint
language: rust
rule:
  any:
    - pattern: sqlx::query($SQL)
    - pattern: sqlx::query::<$$$T>($SQL)
    - pattern: sqlx::query_with($SQL, $ARGS)
    - pattern: sqlx::query_as($SQL)
    - pattern: sqlx::query_as::<$$$T>($SQL)
    - pattern: sqlx::query_as_with::<$$$T>($SQL, $ARGS)
    - pattern: sqlx::query_scalar($SQL)
    - pattern: sqlx::query_scalar::<$$$T>($SQL)
    - pattern: sqlx::query_scalar_with::<$$$T>($SQL, $ARGS)
    - pattern: sqlx::raw_sql($SQL)
