id: community-querybuilder-mutation
message: QueryBuilder constructor/push fragments bound to one receiver
severity: hint
language: rust
rule:
  any:
    - pattern: 'let mut $QB: $TYPE = QueryBuilder::new($SQL);'
    - pattern: 'let mut $QB = QueryBuilder::new($SQL);'
    - pattern: 'let mut $QB: $TYPE = sqlx::QueryBuilder::new($SQL);'
    - pattern: 'let mut $QB = sqlx::QueryBuilder::new($SQL);'
    - pattern: '$QB.push($SQL)'
